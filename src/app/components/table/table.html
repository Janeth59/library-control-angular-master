<div class="card shadow-sm">
  <div class="card-header bg-dark text-white d-flex align-items-center gap-2">
    <span class="badge bg-secondary ms-auto">{{ books.length }} lbrios</span>
  </div>
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover table-striped mb-0">
        <thead class="table-dark">
          <tr>
            <th scope="col">Num Serie</th>
            <th scope="col">Titulo</th>
            <th scope="col">Autor</th>
            <th scope="col">Gneero</th>
            <th scope="col">Publicacion</th>
            <th scope="col">Existencias</th>
            <th scope="col" colspan="2" class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @if (books.length === 0) {
            <tr>
              <td colspan="8" class="text-center text-muted py-4">
                <i class="bi bi-inbox fs-4 d-block mb-1"></i>
                No hay libros
              </td>
            </tr>
          }
          <tr *ngFor="let book of books">
            <td class="fw-semibold">{{ book.book_serie }}</td>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
            <td>{{ book.gender }}</td>
            <td>{{ book.public_date }}</td>
            <td [ngClass]="getStockClass(book.stock)">{{ book.stock }}</td>
            <td class="text-center">
              <button class="btn btn-sm btn-outline-warning" (click)="editBook(book)" title="Editar">
                <i class="bi bi-pencil-fill"></i>
              </button>
            </td>
            <td class="text-center">
              <button class="btn btn-sm btn-outline-danger" (click)="removeBook(book.book_serie)" title="Eliminar">
                <i class="bi bi-trash-fill"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
