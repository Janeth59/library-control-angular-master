<div class="card shadow-sm">
  <div class="card-header bg-dark text-white d-flex align-items-center gap-2">
    <span>{{ isEditingMode ? 'Editar libro' : 'Registrar libro' }}</span>
  </div>
  <div class="card-body">
    <form [formGroup]="bookForm" (ngSubmit)="onSubmit()">
      <div class="row g-3">

        <div class="col-md-4">
          <label for="book_serie" class="form-label">Num de Serie</label>
          <input type="number" id="book_serie" formControlName="book_serie"
            class="form-control" [ngClass]="{'is-invalid': isInvalid('book_serie')}">
          <div class="invalid-feedback">Ingresa un num de serie válido</div>
        </div>

        <div class="col-md-8">
          <label for="title" class="form-label">Titulo</label>
          <input type="text" id="title" formControlName="title"
            class="form-control" [ngClass]="{'is-invalid': isInvalid('title')}">
          <div class="invalid-feedback">Titulo requerido</div>
        </div>

        <div class="col-md-6">
          <label for="author" class="form-label">Autor@</label>
          <input type="text" id="author" formControlName="author"
            class="form-control" [ngClass]="{'is-invalid': isInvalid('author')}">
          <div class="invalid-feedback"> Autor@ requerido</div>
        </div>

        <div class="col-md-6">
          <label for="gender" class="form-label">Genero</label>
          <input type="text" id="gender" formControlName="gender"
            class="form-control" [ngClass]="{'is-invalid': isInvalid('gender')}">
          <div class="invalid-feedback">gnero requerido</div>
        </div>

        <div class="col-md-6">
          <label for="public_date" class="form-label">Fecha de publicación</label>
          <input type="text" id="public_date" formControlName="public_date"
            placeholder="DD/MM/AAAA" class="form-control"
            [ngClass]="{'is-invalid': isInvalid('public_date')}">
          <div class="invalid-feedback">fecha requerida</div>
        </div>

        <div class="col-md-6">
          <label for="stock" class="form-label">Exsietncias</label>
          <input type="number" id="stock" formControlName="stock"
            class="form-control" [ngClass]="{'is-invalid': isInvalid('stock')}">
          <div class="invalid-feedback">Ingresa 0 o mas en numero</div>
        </div>

      </div>

      <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn" [class.btn-primary]="!isEditingMode" [class.btn-warning]="isEditingMode">
          {{ isEditingMode ? 'Actualizar' : 'Guardar' }}
        </button>
        @if (isEditingMode) {
          <button type="button" class="btn btn-secondary" (click)="cancelEdit()">
            <i class="bi bi-x-circle"></i> Cancelar
          </button>
        }
      </div>

    </form>
  </div>
</div>
