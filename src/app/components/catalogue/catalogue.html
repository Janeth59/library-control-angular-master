<div class="container-fluid py-4">
  <div class="card shadow-sm">
    <div class="card-header bg-dark text-white d-flex align-items-center gap-2">
      
      <span>Catalogo</span>
      <span class="badge bg-secondary ms-auto">{{ filtered.length }} libros</span>
    </div>
    <div class="card-body">
      <input
        type="text"
        class="form-control mb-3"
        placeholder="Escribe el titulo, autor@ o genero..."
        [(ngModel)]="searchQuery">
    </div>
    <div class="table-responsive">
      <table class="table table-hover table-striped mb-0">
        <thead class="table-dark">
          <tr>
            <th>Num Serie</th>
            <th>Titulo</th>
            <th>Autor</th>
            <th>Genero</th>
            <th>Publicacion</th>
            <th>Existencias</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let book of filtered">
            <td class="fw-semibold">{{ book.book_serie }}</td>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
            <td><span class="badge bg-secondary">{{ book.gender }}</span></td>
            <td>{{ book.public_date }}</td>
            <td [ngClass]="getStockClass(book.stock)">{{ book.stock }}</td>
          </tr>
          <tr *ngIf="filtered.length === 0">
            <td colspan="6" class="text-center text-muted py-4">
              <i class="bi bi-inbox fs-4 d-block mb-1"></i>
              No hay libros
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
